[project]
name = "rag-security-evaluation"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "pgvector>=0.3.6",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "pypdf>=5.1.0",
  "httpx>=0.28.1",
  "PyJWT>=2.10.1",
  "cryptography>=44.0.0",
  "email-validator>=2.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
files = ["app", "scripts"]
